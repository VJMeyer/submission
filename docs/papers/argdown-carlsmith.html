    <p>AMTAIR extraction (23 nodes) — Meyer (2025) | Used in <a href="https://vjmeyer.github.io/submission/papers/2025-VJM_PredictionMarketIntegration-AMTAIR_EpiOrgsPaper.html">EpiOrgs</a> and <a href="https://vjmeyer.github.io/submission/papers/2025-VJM_ModelPluralism-AMTAIR_PhilOfEconPaper.html">PhilOfEcon</a></p>

    <figure  role="group" class="argdown-figure"><argdown-map      initial-view="map"><div slot="source" class=""><pre class="language-argdown"><code class="language-argdown"><span class="hljs-meta">===
title: Carlsmith (2022) — Is Power-Seeking AI an Existential Risk?
author: Extracted by Meyer (2025) via AMTAIR
subTitle: 23-node causal hierarchy with six conjunctive conditions for AI existential risk
===</span>

<span class="hljs-comment">// MAIN CAUSAL CHAIN</span>

<span class="hljs-statement-title">[Existential_Catastrophe]:</span> The destruction of humanity&#x27;s long-term potential due to AI systems we&#x27;ve lost control over. <span class="hljs-tag">#conclusion</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Human_Disempowerment]</span>

<span class="hljs-statement-title">[Human_Disempowerment]:</span> Permanent and collective disempowerment of humanity relative to AI systems. <span class="hljs-tag">#risk</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Scale_Of_Power_Seeking]</span>

<span class="hljs-statement-title">[Scale_Of_Power_Seeking]:</span> Power-seeking scaling to permanently disempowering all of humanity. <span class="hljs-tag">#risk</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Misaligned_Power_Seeking]</span>
<span class="hljs-attack">  -</span> <span class="hljs-argument-title">&lt;Corrective Capacity&gt;</span>
<span class="hljs-support">    +</span> <span class="hljs-statement-title">[Corrective_Feedback]</span>

<span class="hljs-statement-title">[Misaligned_Power_Seeking]:</span> Deployed AI systems seeking power in unintended and high-impact ways. P(TRUE) = 0<span class="hljs-tag">.338.</span> <span class="hljs-tag">#hub</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[APS_Systems]</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Difficulty_Of_Alignment]</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Deployment_Decisions]</span>

<span class="hljs-comment">// APS SYSTEMS BRANCH</span>

<span class="hljs-statement-title">[APS_Systems]:</span> AI systems with advanced capabilities, agentic planning, and strategic awareness. <span class="hljs-tag">#condition</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Advanced_AI_Capability]:</span> Systems outperforming humans on tasks granting significant power. P(TRUE) = 0<span class="hljs-tag">.80.</span> <span class="hljs-tag">#leaf</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Agentic_Planning]:</span> Systems making and executing plans based on world models. <span class="hljs-tag">#leaf</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Strategic_Awareness]:</span> Systems with models accurately representing power dynamics. <span class="hljs-tag">#leaf</span>

<span class="hljs-comment">// ALIGNMENT BRANCH</span>

<span class="hljs-statement-title">[Difficulty_Of_Alignment]:</span> Harder to build aligned than misaligned systems attractive to deploy. P(TRUE) = 0<span class="hljs-tag">.70.</span> <span class="hljs-tag">#condition</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Instrumental_Convergence]:</span> Misaligned objectives tend to seek power instrumentally. <span class="hljs-tag">#mechanism</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Problems_With_Proxies]:</span> Proxy objectives break correlations with intended goals. <span class="hljs-tag">#mechanism</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Problems_With_Search]:</span> Search processes can yield systems with different objectives than intended. <span class="hljs-tag">#mechanism</span>

<span class="hljs-comment">// DEPLOYMENT BRANCH</span>

<span class="hljs-statement-title">[Deployment_Decisions]:</span> Decisions to deploy potentially misaligned AI systems. P(DEPLOY) = 0<span class="hljs-tag">.60.</span> <span class="hljs-tag">#condition</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Incentives_To_Build_APS]:</span> Strong incentives to build and deploy APS systems. <span class="hljs-tag">#driver</span>
<span class="hljs-support">    +</span> <span class="hljs-statement-title">[Usefulness_Of_APS]:</span> APS systems useful for many valuable tasks. <span class="hljs-tag">#driver</span>
<span class="hljs-support">    +</span> <span class="hljs-statement-title">[Competitive_Dynamics]:</span> Competitive pressures between AI developers. <span class="hljs-tag">#driver</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Deception_By_AI]:</span> AI systems deceiving humans about their true objectives. <span class="hljs-tag">#risk</span>

<span class="hljs-comment">// CORRECTIVE FEEDBACK</span>

<span class="hljs-statement-title">[Corrective_Feedback]:</span> Human society implementing corrections after observing problems. P(EFFECTIVE) = 0<span class="hljs-tag">.60.</span> <span class="hljs-tag">#defense</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Warning_Shots]:</span> Observable failures in weaker systems before catastrophic risks. <span class="hljs-tag">#condition</span>
<span class="hljs-attack">  -</span> <span class="hljs-argument-title">&lt;Rapid Escalation&gt;</span>
<span class="hljs-support">    +</span> <span class="hljs-statement-title">[Rapid_Capability_Escalation]:</span> Capabilities escalating very rapidly, limiting correction time. <span class="hljs-tag">#risk</span>

<span class="hljs-comment">// AUXILIARY CONSEQUENCES</span>

<span class="hljs-statement-title">[Barriers_To_Understanding]:</span> Difficulty understanding advanced AI internals. <span class="hljs-tag">#auxiliary</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Misaligned_Power_Seeking]</span>

<span class="hljs-statement-title">[Adversarial_Dynamics]:</span> Adversarial human-AI relationships. <span class="hljs-tag">#auxiliary</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Misaligned_Power_Seeking]</span>

<span class="hljs-statement-title">[Stakes_Of_Error]:</span> Escalating impact of mistakes. <span class="hljs-tag">#auxiliary</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Misaligned_Power_Seeking]</span>
</code></pre></div><div slot="map">
