    <p>Interactive argument map (47 nodes) — Meyer (2025) | <a href="https://vjmeyer.github.io/submission/papers/2025-VJM_ParadigmFormation-AMTAIR_EvoRatPaper.html">Full paper</a></p>

  <div class="map-container">
    <figure  role="group" class="argdown-figure"><argdown-map      initial-view="map"><div slot="source" class=""><pre class="language-argdown"><code class="language-argdown"><span class="hljs-meta">===
title: EvoRat — Evolutionary Rationality in AI Governance Discourse
author: Meyer (2025)
subTitle: Argument map across diagnostic, mechanistic, and prescriptive layers
===</span>

<span class="hljs-comment">// LAYER 1: DIAGNOSTIC</span>

<span class="hljs-statement-title">[P1]:</span> AI governance discourse exhibits Kuhnian pre-paradigmatic symptoms — no dominant paradigm, competing schools, fundamental debates, no normal science. <span class="hljs-tag">#diagnostic</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[E1]:</span> Four symptoms documented — Bostrom/Christiano/Hanson incompatibility, contested terminology, first-principles reasoning, absence of shared benchmarks. <span class="hljs-tag">#evidence</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[E2]:</span> Massive disagreement on core parameters — P(doom) ranges from under 1% to over 90%; timelines span &quot;already here&quot; to &quot;never.&quot; <span class="hljs-tag">#evidence</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[E6]:</span> Pre-marginalist economics (1750–1870) exhibited similar symptoms yet formalization catalyzed paradigm formation. <span class="hljs-tag">#historical</span>
<span class="hljs-attack">  -</span> <span class="hljs-argument-title">&lt;Kuhnian Objections&gt;</span>
<span class="hljs-support">    +</span> <span class="hljs-statement-title">[D1]:</span> Three objections manageable — scoped to epistemic layers; forcing function resolves distinction; AMTAIR creates feedback mechanism. <span class="hljs-tag">#defense</span>

<span class="hljs-statement-title">[Distinctive_Severity]:</span> AI governance&#x27;s pre-paradigmatic condition is distinctively severe — incommensurable disciplinary cultures, object transforms faster than study, irreversible stakes, time pressure. <span class="hljs-tag">#diagnostic</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[P1]</span>

<span class="hljs-statement-title">[P2]:</span> Existing selection mechanisms are insufficient to favor frameworks that track reality. <span class="hljs-tag">#diagnostic</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[S1]:</span> Paper targets empirical and modeling layers only — normative layer is permanently and appropriately pluralistic. <span class="hljs-tag">#scope</span>

<span class="hljs-comment">// LAYER 2: MECHANISTIC</span>

<span class="hljs-statement-title">[P4]:</span> Cultural evolution theory applies to AI safety arguments — arguments function as cultural replicators subject to variation, transmission, and selection. <span class="hljs-tag">#framework</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[P3]:</span> Existing selection mechanisms actively favor persuasiveness over precision — memetic and epistemic fitness anti-correlate. <span class="hljs-tag">#diagnostic</span>
<span class="hljs-support">    +</span> <span class="hljs-statement-title">[E3]:</span> Timeline prediction evolution 2010–2024 — precision penalized, vagueness rewarded. <span class="hljs-tag">#evidence</span>

<span class="hljs-statement-title">[Conformity_Rational]:</span> Conformity IS individually rational — prestige cascades dominate, failures are correlated. The question is whether the selection environment can be changed. <span class="hljs-tag">#mechanism</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[P8]:</span> Rich&#x27;s Mechanism 2 shows conformity imposes aggregate risk while independent evaluation faces only idiosyncratic risk. AMTAIR converts aggregate to idiosyncratic risk. <span class="hljs-tag">#mechanism</span>
<span class="hljs-support">    +</span> <span class="hljs-statement-title">[E5]:</span> Cascade reversal in AI risk discourse — Hinton broke with consensus in 2023, driven by prestige dynamics not new evidence. <span class="hljs-tag">#evidence</span>
<span class="hljs-support">    +</span> <span class="hljs-statement-title">[S3]:</span> Analysis concerns HOW positions spread, not WHETHER they are correct. <span class="hljs-tag">#scope</span>

<span class="hljs-argument-title">&lt;Feedback Loop&gt;:</span> Missing accuracy-selection and perverse selection toward memetic fitness create a self-perpetuating feedback loop.
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[P2]</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[P3]</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[P4]</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Conformity_Rational]</span>
<span class="hljs-attack">  -&gt;</span> <span class="hljs-statement-title">[I1]</span>

<span class="hljs-statement-title">[I1]:</span> Conformity within clusters deepens fragmentation between clusters. Reverse cascades redirect conformity without producing convergence. <span class="hljs-tag">#inference</span>

<span class="hljs-argument-title">&lt;Discourse Trap&gt;:</span> The self-perpetuating cycle cannot be broken from within.
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[I1]</span>
<span class="hljs-attack">  -&gt;</span> <span class="hljs-statement-title">[I2]</span>

<span class="hljs-statement-title">[I2]:</span> Normal discourse cannot break this cycle — more arguments strengthen within-cluster cascades without bridging inter-cluster gaps. <span class="hljs-tag">#inference</span>

<span class="hljs-statement-title">[P5]:</span> A paradigm WILL emerge regardless — deployment decisions, regulatory frameworks, and capability trajectories force convergence. <span class="hljs-tag">#forcing</span>

<span class="hljs-argument-title">&lt;Reframing&gt;:</span> Forced convergence combined with discursive self-perpetuation reframes the central question.
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[P5]</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[I2]</span>
<span class="hljs-attack">  -&gt;</span> <span class="hljs-statement-title">[I3]</span>

<span class="hljs-statement-title">[I3]:</span> The question is not WHETHER but HOW paradigm formation occurs — through cascades of social influence or through evidence-based comparison. <span class="hljs-tag">#inference</span>

<span class="hljs-comment">// LAYER 3: PRESCRIPTIVE</span>

<span class="hljs-statement-title">[Existing_Tools_Insufficient]:</span> Manual formalization infeasible at scale; pure forecasting lacks causal structure; existing tools require manual input. <span class="hljs-tag">#feasibility</span>

<span class="hljs-statement-title">[P12]:</span> AMTAIR enables 20x speedup, making corpus-scale formalization tractable. <span class="hljs-tag">#feasibility</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Existing_Tools_Insufficient]</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[P6]:</span> AMTAIR makes implicit causal models explicit, comparable, and testable by extracting arguments as Bayesian networks. <span class="hljs-tag">#technical</span>
<span class="hljs-support">    +</span> <span class="hljs-statement-title">[E4]:</span> Carlsmith&#x27;s power-seeking argument extracted as six conjunctive conditions with probability ranges, enabling sensitivity analysis. <span class="hljs-tag">#evidence</span>
<span class="hljs-attack">    -</span> <span class="hljs-argument-title">&lt;Hallucination Risk&gt;</span>
<span class="hljs-support">      +</span> <span class="hljs-statement-title">[D2]:</span> Structural hallucination addressable through defense-in-depth — source linking, human validation, adversarial review. <span class="hljs-tag">#defense</span>

<span class="hljs-statement-title">[M1]:</span> Precision becomes measurable and rewarded — vague claims fail extraction; precise claims extract cleanly and become comparable. <span class="hljs-tag">#mechanism</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[P6]</span>

<span class="hljs-statement-title">[M2]:</span> Vagueness becomes penalized — vague claims yield uninformative networks that cannot participate in policy evaluation. <span class="hljs-tag">#mechanism</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[P6]</span>

<span class="hljs-statement-title">[M3]:</span> Prediction tracking creates accountability — Bayesian networks generate testable predictions; models that predict well gain credibility. <span class="hljs-tag">#mechanism</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[P6]</span>

<span class="hljs-statement-title">[M4]:</span> Hidden assumptions surface — implicit value judgments and tacit probabilities forced to the surface during extraction. <span class="hljs-tag">#mechanism</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[P6]</span>

<span class="hljs-statement-title">[Formalization_Forecasting_Synergy]:</span> Formalization and forecasting are complementary — formalization shows WHAT to forecast, forecasting shows HOW WELL models predict. <span class="hljs-tag">#mechanism</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[P6]</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[M3]</span>

<span class="hljs-argument-title">&lt;Selection Shift&gt;:</span> The combined effect of formalization and four selection mechanisms creates structural competitive pressure toward accuracy.
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[M1]</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[M2]</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[M3]</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[M4]</span>
<span class="hljs-attack">  -&gt;</span> <span class="hljs-statement-title">[I4]</span>

<span class="hljs-statement-title">[I4]:</span> Making models formally comparable creates structural competitive pressure toward accuracy. Quality becomes measurable and measurability changes what is rewarded. <span class="hljs-tag">#inference</span>
<span class="hljs-attack">  -</span> <span class="hljs-argument-title">&lt;Goodhart Risk&gt;</span>
<span class="hljs-support">    +</span> <span class="hljs-statement-title">[D3]:</span> Five anti-gaming mechanisms — source-linked prediction tracking, adversarial validation, complexity penalties, gaming detection, independent audit. <span class="hljs-tag">#defense</span>
<span class="hljs-attack">  -</span> <span class="hljs-argument-title">&lt;No Precedent&gt;</span>
<span class="hljs-support">    +</span> <span class="hljs-statement-title">[S2]:</span> No technology deployed to engineer discourse selection dynamics, but theoretical contribution stands regardless. <span class="hljs-tag">#scope</span>

<span class="hljs-argument-title">&lt;Risk Conversion&gt;:</span> Accuracy pressure combined with risk structure conversion shifts the selection landscape.
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[I4]</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[P8]</span>
<span class="hljs-attack">  -&gt;</span> <span class="hljs-statement-title">[I5]</span>

<span class="hljs-statement-title">[I5]:</span> Discourse shifts from persuasion game toward accuracy game. Selection pressure shifts from memetic to epistemic fitness. <span class="hljs-tag">#inference</span>

<span class="hljs-statement-title">[Adoption_Achieved]:</span> Sufficient adoption for network effects — 30–50% of researchers, 100+ formal models. The linchpin assumption. <span class="hljs-tag">#inference</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[I5]</span>
<span class="hljs-attack">  -</span> <span class="hljs-argument-title">&lt;Adoption Barrier&gt;</span>
<span class="hljs-support">    +</span> <span class="hljs-statement-title">[D5]:</span> Adoption barriers addressable — funder requirements create critical mass; prestige bootstrap uses existing dynamics. <span class="hljs-tag">#defense</span>
<span class="hljs-attack">  -</span> <span class="hljs-argument-title">&lt;Prestige Paradox&gt;</span>
<span class="hljs-support">    +</span> <span class="hljs-statement-title">[Prestige_Bootstrap_Irony]:</span> AMTAIR adoption may depend on the prestige dynamics it aims to transcend. <span class="hljs-tag">#defense</span>

<span class="hljs-statement-title">[P9]:</span> Most apparent value disagreements are actually empirical or modeling disagreements in disguise. Decomposition is achievable. <span class="hljs-tag">#decomposition</span>
<span class="hljs-attack">  -</span> <span class="hljs-argument-title">&lt;Values Objection&gt;</span>
<span class="hljs-support">    +</span> <span class="hljs-statement-title">[D4]:</span> AMTAIR reveals rather than resolves value conflicts, enabling negotiation on the Pareto frontier. <span class="hljs-tag">#defense</span>

<span class="hljs-argument-title">&lt;Enablement&gt;:</span> Accuracy shift, decomposition capacity, and adoption combine to establish the enabling claim.
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[I5]</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[P9]</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Adoption_Achieved]</span>
<span class="hljs-attack">  -&gt;</span> <span class="hljs-statement-title">[I6]</span>

<span class="hljs-statement-title">[I6]:</span> AMTAIR ENABLES decomposition of disagreements into empirical and normative components. This PLAUSIBLY transforms governance IF incentives make formalization rational. <span class="hljs-tag">#inference</span>

<span class="hljs-statement-title">[Partial_Success_Sufficient]:</span> Even moderate mechanism success improves on current conditions. <span class="hljs-tag">#defense</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[D2]</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[D3]</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[D5]</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[D4]</span>

<span class="hljs-argument-title">&lt;Main Conclusion&gt;:</span> Accuracy-selection combined with adoption and partial-success robustness yields the ultimate claim.
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[I6]</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Partial_Success_Sufficient]</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Formalization_Forecasting_Synergy]</span>
<span class="hljs-attack">  -&gt;</span> <span class="hljs-statement-title">[I7]</span>

<span class="hljs-statement-title">[I7]:</span> AMTAIR enables a structural shift — making implicit models explicit, predictions testable, and accuracy measurable creates conditions where precision can outcompete vagueness. The distance between &quot;enables&quot; and &quot;transforms&quot; is the adoption gap. <span class="hljs-tag">#conclusion</span>

<span class="hljs-comment">// SCOPING QUALIFICATIONS</span>

<span class="hljs-statement-title">[S4]:</span> Theoretical mechanism without empirical validation. Presented as hypothesis worth testing. <span class="hljs-tag">#scope</span>

<span class="hljs-statement-title">[S5]:</span> Five testable predictions for 3–5 year pilot. <span class="hljs-tag">#falsifiable</span>

<span class="hljs-statement-title">[S6]:</span> Five additional predictions from Rich&#x27;s framework applied. <span class="hljs-tag">#falsifiable</span>

<span class="hljs-statement-title">[E7]:</span> Pre-marginalist economics provides historical precedent for formalization-catalyzed paradigm formation. <span class="hljs-tag">#historical</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[P1]</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[I4]</span>
</code></pre></div><div slot="map">
