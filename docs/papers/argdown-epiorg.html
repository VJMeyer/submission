    <h1>Live Models: Integrating Prediction Markets into AMTAIR</h1>
    <p>Interactive argument map (17 nodes) — Meyer (2025) | <a href="https://vjmeyer.github.io/submission/papers/2025-VJM_PredictionMarketIntegration-AMTAIR_EpiOrgsPaper.html">Full paper</a></p>

<figure  role="group" class="argdown-figure"><argdown-map      initial-view="map"><div slot="source" class=""><pre class="language-argdown"><code class="language-argdown"><span class="hljs-meta">===
title: &quot;Meyer (2025) — Live Models: Integrating Prediction Markets into AMTAIR&quot;
author: &quot;Extracted by AMTAIR pipeline&quot;
subTitle: &quot;Argument map of the paper&#x27;s own three-step elimination argument&quot;
===</span>

<span class="hljs-comment">// CONSTITUTIVE TENSION (Core Claim)</span>

<span class="hljs-statement-title">[Constitutive_Tension]:</span> AMTAIR&#x27;s contamination problem is constitutive: properties the system needs (publicity, authority, broad uptake) ARE the properties that create contamination risk. <span class="hljs-tag">#core</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Value_Creates_Risk]</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Staleness_Necessitates_Integration]</span>

<span class="hljs-statement-title">[Value_Creates_Risk]:</span> Each design feature that makes AMTAIR valuable simultaneously opens a contamination channel. Public accessibility, ensemble methods, author refinement, and broad uptake all create both value and risk. <span class="hljs-tag">#diagnostic</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Public_Accessibility]:</span> Public dashboards expose outputs to forecasters whose independent judgment the system needs. <span class="hljs-tag">#mechanism</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Broad_Uptake]:</span> Broad adoption correlates forecaster beliefs with AMTAIR models even without direct consultation. <span class="hljs-tag">#mechanism</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Author_Refinement]:</span> Authors adjusting formalizations risk within-repository contamination when matching priors. <span class="hljs-tag">#mechanism</span>

<span class="hljs-comment">// STALENESS AND INTEGRATION NECESSITY</span>

<span class="hljs-statement-title">[Staleness_Necessitates_Integration]:</span> AMTAIR models embed the epistemic state of authors at writing time, creating parametric and structural staleness that prediction markets can address. <span class="hljs-tag">#diagnostic</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Parametric_Staleness]:</span> Probability estimates become outdated while underlying argument structure remains valid. <span class="hljs-tag">#mechanism</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Structural_Staleness]:</span> Entire argumentative frameworks become obsolete as the field evolves. <span class="hljs-tag">#mechanism</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Correlated_Staleness]:</span> Shared empirical sources and theoretical frameworks create correlated obsolescence across ensembles. <span class="hljs-tag">#mechanism</span>

<span class="hljs-statement-title">[Integration_Benefits]:</span> Prediction market integration provides structural transparency through BN decomposition and cross-boundary aggregation across fragmented communities. <span class="hljs-tag">#support</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Staleness_Necessitates_Integration]</span>

<span class="hljs-statement-title">[Informal_Integration_Inevitable]:</span> Practitioners will connect PM and AMTAIR sources informally regardless; the question is whether integration is managed or ad hoc. <span class="hljs-tag">#support</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Staleness_Necessitates_Integration]</span>

<span class="hljs-comment">// FEEDBACK LOOP</span>

<span class="hljs-statement-title">[Feedback_Loop]:</span> Five-step contamination cycle: AMTAIR publishes, forecasters observe, markets shift, AMTAIR ingests contaminated prices, model confidence changes spuriously. <span class="hljs-tag">#risk</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Constitutive_Tension]</span>

<span class="hljs-statement-title">[Three_Contamination_Types]:</span> Three distinct mechanisms: one-shot probabilistic anchoring (mean bias), feedback loop contamination (variance collapse), and framing contamination (dimensionality reduction). <span class="hljs-tag">#mechanism</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Feedback_Loop]</span>

<span class="hljs-comment">// STEP 1: FULL-CONTROL STATISTICS (powerful but impractical)</span>

<span class="hljs-statement-title">[Full_Control_Powerful]:</span> Under full platform control (as DAGGRE enjoyed), statistical tools become substantially more powerful: contamination is experimentally measurable through randomized assignment. <span class="hljs-tag">#condition</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[DAGGRE_Comparison]:</span> DAGGRE demonstrated BN-forecast integration works in closed-loop systems with internal feedback containment. <span class="hljs-tag">#evidence</span>

<span class="hljs-statement-title">[Full_Control_Impractical]:</span> AMTAIR&#x27;s aspiration to shared epistemic infrastructure requires open-loop bidirectionality with external forecasting communities, making DAGGRE-style control impossible. <span class="hljs-tag">#condition</span>
<span class="hljs-attack">  -</span> <span class="hljs-statement-title">[Full_Control_Powerful]</span>

<span class="hljs-statement-title">[Framing_Persists]:</span> Even under full platform control, framing contamination persists: AMTAIR&#x27;s causal decompositions must be public for peer review and these structure how forecasters reason. <span class="hljs-tag">#condition</span>
<span class="hljs-attack">  -</span> <span class="hljs-statement-title">[Full_Control_Powerful]</span>

<span class="hljs-argument-title">&lt;Tier_1_Elimination&gt;:</span> Full-control statistics nearly solves the problem but AMTAIR cannot exercise full control, and even full control leaves framing contamination intact.
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Full_Control_Powerful]</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Full_Control_Impractical]</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Framing_Persists]</span>
<span class="hljs-attack">  -&gt;</span> <span class="hljs-statement-title">[Statistical_Insufficiency]</span>

<span class="hljs-comment">// STEP 2: DASHBOARD-ONLY STATISTICS (partial but needs org inputs)</span>

<span class="hljs-statement-title">[Statistical_Insufficiency]:</span> Under AMTAIR&#x27;s dashboard-only architecture, practical tools degrade but remain useful, yet each requires organizational infrastructure it does not generate. <span class="hljs-tag">#hub</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Alpha_Needs_Infrastructure]:</span> Quality parameters require track-record infrastructure maintained by platform organizations. <span class="hljs-tag">#mechanism</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Gamma_Needs_Metadata]:</span> Contamination parameters require exposure metadata that someone must design, fund, and maintain. <span class="hljs-tag">#mechanism</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[K_Unobservable]:</span> The number of forecasters who observed AMTAIR outputs becomes unobservable without organizational tracking. <span class="hljs-tag">#mechanism</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Embargo_Needs_Commitment]:</span> Embargo enforcement requires institutional commitment, not just software configuration. <span class="hljs-tag">#mechanism</span>

<span class="hljs-comment">// STEP 3: ORGANIZATIONAL EPISTEMOLOGY</span>

<span class="hljs-argument-title">&lt;Identification_Problem&gt;:</span> The statistical framework cannot KNOW what it needs: its parameters require organizational information environments outside the formal apparatus.
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Statistical_Insufficiency]</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Alpha_Needs_Infrastructure]</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Gamma_Needs_Metadata]</span>
<span class="hljs-attack">  -&gt;</span> <span class="hljs-statement-title">[Org_Gap]</span>

<span class="hljs-argument-title">&lt;Amplification_Problem&gt;:</span> Even if parameters were perfectly estimated, organizational dynamics intervene between prescription and implementation.
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Org_Gap]</span>
<span class="hljs-attack">  -&gt;</span> <span class="hljs-statement-title">[Vices_Explain_Failure]</span>

<span class="hljs-statement-title">[Org_Gap]:</span> The gap between statistical prescription and AMTAIR&#x27;s reality has two components: practical (architecture lacks conditions for full control) and principled (framing contamination persists regardless). <span class="hljs-tag">#hub</span>

<span class="hljs-comment">// INDIVIDUAL VICES (amplified by structure)</span>

<span class="hljs-statement-title">[Vices_Explain_Failure]:</span> Epistemic vices are not labels applied after the fact but causal explanations of why infrastructure statistical tools need is unlikely to emerge spontaneously. <span class="hljs-tag">#framework</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Hubris]:</span> Epistemic hubris explains why embargo protocols get overridden: AMTAIR&#x27;s quantitative precision creates an illusion of certainty making contamination controls appear unnecessary. <span class="hljs-tag">#vice</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Insouciance]:</span> Epistemic insouciance explains why exposure metadata never gets collected: AMTAIR&#x27;s institutional setting places it outside compliance mandates and contamination damage is subtle and delayed. <span class="hljs-tag">#vice</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Injustice]:</span> Epistemic injustice explains why authority overrides calibration: quantitative reasoning carries disproportionate credence in AMTAIR&#x27;s operating communities. <span class="hljs-tag">#vice</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Fragmentation]:</span> Organizational fragmentation means no single actor sees the whole contamination loop spanning AMTAIR operators, forecasting platforms, and policy teams. <span class="hljs-tag">#vice</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Complexity]:</span> Organizational complexity means multiple extractions, ensemble methods, author refinement, and cross-platform propagation create pathways too intricate for any individual to trace. <span class="hljs-tag">#vice</span>

<span class="hljs-statement-title">[Individual_Collective_Distinction]:</span> Hubris, insouciance, and injustice are individual dispositions amplified by structure; fragmentation and complexity are genuinely collective vices irreducible to individual-level analysis. <span class="hljs-tag">#framework</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Vices_Explain_Failure]</span>

<span class="hljs-comment">// VICE-VULNERABILITY MAPPING</span>

<span class="hljs-statement-title">[Vice_Vulnerability_Mapping]:</span> Each vice maps a specific mechanism through which organizational dynamics prevent a statistical prerequisite from functioning, generating institution-specific prescriptions. <span class="hljs-tag">#product</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Vices_Explain_Failure]</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Statistical_Insufficiency]</span>

<span class="hljs-comment">// RECURSIVE CAPSTONE</span>

<span class="hljs-statement-title">[Recursive_Challenge]:</span> The institution operating AMTAIR would itself be subject to every vice the mapping identifies. Each governance layer reduces risk; none eliminates it. <span class="hljs-tag">#qualifier</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Vice_Vulnerability_Mapping]</span>

<span class="hljs-comment">// CONCLUSION</span>

<span class="hljs-argument-title">&lt;Main_Argument&gt;:</span> The constitutive tension, three-step elimination, and vice-vulnerability mapping establish the paper&#x27;s central conclusion.
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Constitutive_Tension]</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Statistical_Insufficiency]</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Vices_Explain_Failure]</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Vice_Vulnerability_Mapping]</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Recursive_Challenge]</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Informal_Integration_Inevitable]</span>
<span class="hljs-attack">  -&gt;</span> <span class="hljs-statement-title">[Managed_Over_Unmanaged]</span>

<span class="hljs-statement-title">[Managed_Over_Unmanaged]:</span> Managed integration with named vulnerabilities and organizational safeguards is categorically preferable to unmanaged informal integration that will occur regardless. <span class="hljs-tag">#conclusion</span>
</code></pre></div><div slot="map">
