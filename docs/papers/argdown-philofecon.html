    <h1>Practicing Model Pluralism: From Expert Intuitions to Governance Infrastructure</h1>
    <p>Interactive argument map (20 nodes) — Meyer (2025) | <a href="https://vjmeyer.github.io/submission/papers/2025-VJM_ModelPluralism-AMTAIR_PhilOfEconPaper.html">Full paper</a></p>

  <div class="map-container">
<figure  role="group" class="argdown-figure"><argdown-map      initial-view="map"><div slot="source" class=""><pre class="language-argdown"><code class="language-argdown"><span class="hljs-meta">===
title: &quot;Meyer (2025) — Practicing Model Pluralism&quot;
author: &quot;Extracted by AMTAIR pipeline&quot;
subTitle: &quot;From expert intuitions to governance infrastructure via level-separation&quot;
===</span>

<span class="hljs-comment">// THEORETICAL FOUNDATION: Veit&#x27;s Strong Model Pluralism</span>

<span class="hljs-statement-title">[Strong_Model_Pluralism]:</span> Complex phenomena require multiple models serving different epistemic functions: explanation, prediction, and intervention cannot be simultaneously optimized. <span class="hljs-tag">#foundation</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Levins_Tradeoffs]:</span> Irreconcilable trade-offs between generality, realism, and precision constrain any modeling of complex systems. <span class="hljs-tag">#mechanism</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Multiplicity_Of_Functions]:</span> Models serve a multiplicity of functions (E/P/I) and different functions require different optimizations. <span class="hljs-tag">#mechanism</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Cognitive_Limits]:</span> World complexity meets cognitive limitations: comprehensive models exceed human capacity. <span class="hljs-tag">#mechanism</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Underdetermination]:</span> Duhem-Quine underdetermination makes model pluralism epistemically mandatory since evidence cannot uniquely determine correct models. <span class="hljs-tag">#mechanism</span>

<span class="hljs-statement-title">[EPI_Framework]:</span> Three primary epistemic modes: explanation (E) queries causal mechanisms, prediction (P) queries probability distributions, intervention (I) applies do-calculus. These are functions and scientific goals, not model types. <span class="hljs-tag">#framework</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Strong_Model_Pluralism]</span>

<span class="hljs-statement-title">[Pluralism_Extends_To_Policy]:</span> Veit&#x27;s arguments extend to policy because Levins&#x27; trade-offs constrain any complex system modeling, cognitive limitations apply universally, and the multiplicity of functions is equally pronounced in governance. <span class="hljs-tag">#extension</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Strong_Model_Pluralism]</span>

<span class="hljs-statement-title">[Embarrassment_Of_Riches]:</span> As model libraries expand, selection becomes increasingly difficult. The Commerce official&#x27;s objection has force: multiple models without selection criteria appear less useful than one focused model. <span class="hljs-tag">#challenge</span>
<span class="hljs-attack">  -</span> <span class="hljs-statement-title">[Strong_Model_Pluralism]</span>

<span class="hljs-statement-title">[Veit_Reframing]:</span> The embarrassment only exists if you seek one model for all purposes. Permanent pluralism means different models serve irreducibly different functions. The embarrassment stems from expecting models to serve all goals simultaneously. <span class="hljs-tag">#defense</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Embarrassment_Of_Riches]</span>

<span class="hljs-comment">// DIAGNOSTIC: TACIT ENSEMBLE AND CURRENT FAILURES</span>

<span class="hljs-statement-title">[Tacit_Ensemble]:</span> Experts carry implicit distributions over models built through years of practice: their probability estimates conceal complex epistemic states weighting multiple scenarios. Single models in public discourse are communication artifacts, not genuine epistemic states. <span class="hljs-tag">#diagnostic</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Pluralism_Extends_To_Policy]</span>

<span class="hljs-statement-title">[Current_Practice_Fails]:</span> Institutional formats force single-model outputs, destroying tacit ensemble knowledge through two systematic pathologies. <span class="hljs-tag">#diagnostic</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Model_As_Rhetoric]:</span> Experts select the single model supporting their view and present it as the basis for recommendation, producing shadow play neither side fully believes. <span class="hljs-tag">#pathology</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Premature_Aggregation]:</span> Models are aggregated and averaged long before being queried for specific questions, destroying model identity, disagreement structure, and sensitivity information. <span class="hljs-tag">#pathology</span>

<span class="hljs-comment">// CONCEPTUAL CONTRIBUTION: Level-Separation + Uncertainty Preservation</span>

<span class="hljs-statement-title">[Level_Separation]:</span> Model-level pluralism is compatible with policy-level convergence. One can maintain diverse models while asking which policies are robust across them without first resolving which model is best. <span class="hljs-tag">#concept</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Current_Practice_Fails]</span>
<span class="hljs-attack">  -</span> <span class="hljs-argument-title">&lt;False_Consensus_Risk&gt;</span>
<span class="hljs-support">    +</span> <span class="hljs-statement-title">[Not_Monism]:</span> Level-separation is not selecting the best model, averaging into false consensus, or relativism. It is asking a different kind of question about policies rather than models. <span class="hljs-tag">#qualifier</span>

<span class="hljs-statement-title">[Uncertainty_Preservation]:</span> Epistemic uncertainty should be maintained in its most structured form (distributions over models) and collapsed only when a specific decision requires a specific input. Minimize informational compression until decision-forcing moments. <span class="hljs-tag">#principle</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Current_Practice_Fails]</span>

<span class="hljs-argument-title">&lt;Convergence&gt;:</span> Level-separation and uncertainty preservation mutually support each other: understanding why current practices fail shows what must be preserved; level-separation shows what preservation is for.
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Level_Separation]</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Uncertainty_Preservation]</span>
<span class="hljs-attack">  -&gt;</span> <span class="hljs-statement-title">[Three_Requirements]</span>

<span class="hljs-comment">// DERIVED REQUIREMENTS</span>

<span class="hljs-statement-title">[Three_Requirements]:</span> Level-separation and uncertainty preservation jointly imply three specific capability requirements for working with permanent pluralism. <span class="hljs-tag">#derivation</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Ensemble_Maintenance]:</span> Models must persist as distinct, identifiable entities. Required to have multiple models to query across. <span class="hljs-tag">#requirement</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Multi_Functional_Queryability]:</span> The same model must support explanation, prediction, and intervention queries. Required to ask each model about policy implications. <span class="hljs-tag">#requirement</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Common_Representation]:</span> Models must be comparable in a common format enabling structural comparison with per-query aggregation. Required to compare answers and aggregate when decisions demand it. <span class="hljs-tag">#requirement</span>

<span class="hljs-comment">// REPRESENTATION ANSWER: CBNs</span>

<span class="hljs-statement-title">[CBNs_Satisfy_All_Three]:</span> Pearl&#x27;s causal Bayesian networks satisfy all three requirements by mathematical necessity. <span class="hljs-tag">#solution</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Three_Requirements]</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[CBN_Ensemble]:</span> BNs are discrete objects forming natural ensembles; BMA provides aggregation when queries demand it while the library persists. <span class="hljs-tag">#mechanism</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[CBN_Multi_Functional]:</span> Within Pearl&#x27;s SCM framework, the same graph supports explanation (causal structure), prediction (probability distributions), and intervention (do-calculus). <span class="hljs-tag">#mechanism</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[CBN_Common_Format]:</span> All models as Bayesian networks share a common format enabling structural comparison and principled aggregation. <span class="hljs-tag">#mechanism</span>

<span class="hljs-statement-title">[Format_Monism_Concern]:</span> Does requiring a common format impose representational uniformity replacing theoretical uniformity? Format-uniformity need not entail content-uniformity, but whether this holds under optimization pressure is genuinely uncertain. <span class="hljs-tag">#challenge</span>
<span class="hljs-attack">  -</span> <span class="hljs-statement-title">[CBNs_Satisfy_All_Three]</span>

<span class="hljs-comment">// BMA AS COORDINATION INFRASTRUCTURE</span>

<span class="hljs-statement-title">[BMA_Infrastructure]:</span> Bayesian Model Averaging provides mathematical framework for implementing pluralism formally: maintaining the entire ensemble and weighting predictions by model probability given data. <span class="hljs-tag">#solution</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[CBNs_Satisfy_All_Three]</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[BMA_Not_Monism]:</span> BMA produces a distribution, not a point estimate. All models persist with non-zero weight. Aggregation is per-query, not permanent. The epistemic commitment remains plural. <span class="hljs-tag">#qualifier</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Query_Principle]:</span> Maintain pluralism as long as possible and condense only when a specific policy question demands a cross-model answer. After the query, models remain distinct. <span class="hljs-tag">#principle</span>

<span class="hljs-comment">// PRACTICAL CONTRIBUTION: AMTAIR FEASIBILITY</span>

<span class="hljs-statement-title">[AMTAIR_Feasibility]:</span> AMTAIR demonstrates that CBN formalizations can be extracted from natural language arguments at scale using frontier LLMs, reducing extraction from 20+ expert hours to minutes plus validation. <span class="hljs-tag">#practical</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[CBNs_Satisfy_All_Three]</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Cost_Reduction]:</span> When ensemble maintenance is cheap, you can aggregate late rather than early. This cost reduction is what makes proper uncertainty preservation feasible. <span class="hljs-tag">#mechanism</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Multi_Functional_Demo]:</span> The same extracted Carlsmith network serves explanation (query causal structure), prediction (compute probabilities), and intervention (apply do-calculus). <span class="hljs-tag">#evidence</span>

<span class="hljs-statement-title">[Minimal_Formalization]:</span> AMTAIR pursues minimal necessary formalization: the simplest structure to enable policy-level coordination without claiming to capture everything models contain. <span class="hljs-tag">#qualifier</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[AMTAIR_Feasibility]</span>

<span class="hljs-statement-title">[Policy_Preference_Innovation]:</span> AMTAIR maps models to policy implications rather than forcing model selection. Models may be theoretically incommensurable but their policy implications exist in common space. <span class="hljs-tag">#innovation</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[AMTAIR_Feasibility]</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Level_Separation]</span>

<span class="hljs-comment">// CRITICAL LIMITS</span>

<span class="hljs-statement-title">[Epistemic_Culture_Clash]:</span> Formalization privileges quantitative over qualitative reasoning and hierarchical over narrative arguments. The system captures the predictive shadow of each argument, not all aspects. <span class="hljs-tag">#limitation</span>
<span class="hljs-attack">  -</span> <span class="hljs-statement-title">[AMTAIR_Feasibility]</span>

<span class="hljs-statement-title">[Automation_Dependencies]:</span> Over-reliance on extractions, dependency on tools requiring expertise to validate, and gaming possibilities where arguments optimize for extraction rather than accuracy. <span class="hljs-tag">#limitation</span>
<span class="hljs-attack">  -</span> <span class="hljs-statement-title">[AMTAIR_Feasibility]</span>

<span class="hljs-statement-title">[Fundamental_Boundaries]:</span> AMTAIR cannot extract tacit knowledge, cannot resolve value disagreements (only clarify them), cannot guarantee completeness, and cannot eliminate judgment. <span class="hljs-tag">#limitation</span>
<span class="hljs-attack">  -</span> <span class="hljs-statement-title">[AMTAIR_Feasibility]</span>

<span class="hljs-comment">// MAIN CONCLUSION</span>

<span class="hljs-argument-title">&lt;Main_Argument&gt;:</span> Theoretical foundation, conceptual tools, and practical feasibility combine to establish the paper&#x27;s central claim.
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Strong_Model_Pluralism]</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Level_Separation]</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Uncertainty_Preservation]</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Three_Requirements]</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[CBNs_Satisfy_All_Three]</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[AMTAIR_Feasibility]</span>
<span class="hljs-support">  +</span> <span class="hljs-statement-title">[Policy_Preference_Innovation]</span>
<span class="hljs-attack">  -&gt;</span> <span class="hljs-statement-title">[Actionable_Pluralism]</span>

<span class="hljs-statement-title">[Actionable_Pluralism]:</span> Permanent pluralism need not paralyze governance. With the right infrastructure (CBNs plus AMTAIR), model diversity becomes a resource for identifying robust action rather than an obstacle. Current institutional practices that force compression of ensemble knowledge into false certainty are improvable. <span class="hljs-tag">#conclusion</span>
<span class="hljs-attack">  -</span> <span class="hljs-statement-title">[Format_Monism_Concern]</span>
<span class="hljs-attack">  -</span> <span class="hljs-statement-title">[Epistemic_Culture_Clash]</span>
<span class="hljs-attack">  -</span> <span class="hljs-statement-title">[Fundamental_Boundaries]</span>
</code></pre></div><div slot="map">

<text text-anchor="start" x="1932.83" y="-1334" font-family="arial" font-weight="bold" font-size="10.00" fill="#000000">Actionable_Pluralism</text>
<text text-anchor="start" x="1892.54" y="-1317" font-family="arial" font-size="10.00" fill="#000000">Permanent pluralism need not paralyze</text>
<text text-anchor="start" x="1919.76" y="-1305" font-family="arial" font-size="10.00" fill="#000000"> governance. With the right</text>
<text text-anchor="start" x="1898.95" y="-1293" font-family="arial" font-size="10.00" fill="#000000"> infrastructure (CBNs plus AMTAIR),</text>
<text text-anchor="start" x="1890.88" y="-1281" font-family="arial" font-size="10.00" fill="#000000"> model diversity becomes a resource for</text>
<text text-anchor="start" x="1900.03" y="-1269" font-family="arial" font-size="10.00" fill="#000000"> identifying robust action rather than</text>
<text text-anchor="start" x="1906.71" y="-1257" font-family="arial" font-size="10.00" fill="#000000"> an obstacle. Current institutional</text>
<text text-anchor="start" x="1900.59" y="-1245" font-family="arial" font-size="10.00" fill="#000000"> practices that force compression of</text>
<text text-anchor="start" x="1909.76" y="-1233" font-family="arial" font-size="10.00" fill="#000000"> ensemble knowledge into false</text>
<text text-anchor="start" x="1895.6" y="-1221" font-family="arial" font-size="10.00" fill="#000000"> certainty are improvable. #conclusion</text>
